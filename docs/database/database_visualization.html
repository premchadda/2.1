<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trstprep V2.0 - Documentation Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        /* Modern Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px var(--shadow);
            backdrop-filter: blur(10px);
        }

        .navbar-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-logo {
            font-size: 1.8rem;
        }

        .brand-text {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            flex: 1;
            margin: 0 40px;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        .theme-icon {
            font-size: 1.2rem;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
            min-height: calc(100vh - 70px);
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .nav-tabs {
                margin: 0 20px;
            }
        }

        @media (max-width: 768px) {
            .navbar-container {
                flex-wrap: wrap;
                height: auto;
                padding: 15px 20px;
                gap: 15px;
            }

            .nav-tabs {
                order: 3;
                width: 100%;
                margin: 0;
            }

            .tab-btn {
                flex: 1;
                min-width: 140px;
                padding: 8px 12px;
                font-size: 0.85rem;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>
    <!-- Modern Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="#" class="brand">
                <span class="brand-logo">📚</span>
                <span class="brand-text">Trstprep Docs</span>
            </a>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('project-structure')">
                    📁 Project Structure
                </button>
                <button class="tab-btn" onclick="switchTab('database-hierarchy')">
                    🌳 Database Hierarchy
                </button>
                <button class="tab-btn" onclick="switchTab('database-schema')">
                    🗄️ Database Schema
                </button>
                <button class="tab-btn" onclick="switchTab('database-visualization')">
                    📊 Visualization
                </button>
            </div>

            <button class="theme-toggle" onclick="toggleTheme()">
                <span class="theme-icon" id="theme-icon">🌙</span>
                <span id="theme-text">Dark</span>
            </button>
        </div>
    </nav>

    <!-- Tab 1: Project Structure -->
    <div id="project-structure" class="tab-content active">
        <div class="loading">Project Structure content will be loaded here...</div>
    </div>

    <!-- Tab 2: Database Hierarchy -->
    <div id="database-hierarchy" class="tab-content">
        <div class="loading">Database Hierarchy content will be loaded here...</div>
    </div>

    <!-- Tab 3: Database Schema -->
    <div id="database-schema" class="tab-content">
        <div class="loading">Database Schema content will be loaded here...</div>
    </div>

    <!-- Tab 4: Database Visualization -->
    <div id="database-visualization" class="tab-content">
        <div class="loading">D3.js Visualization will be loaded here...</div>
    </div>

    <script>
        // Store original content from each section
        const originalContent = {
            'project-structure': null,
            'database-hierarchy': null,
            'database-schema': null,
            'database-visualization': null
        };

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            extractAndStoreContent();
            
            // Set initial theme
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        });

        // Extract content from existing HTML sections
        function extractAndStoreContent() {
            // Find all the pasted HTML documents in the current file
            const parser = new DOMParser();
            const docText = document.documentElement.outerHTML;
            
            // Extract Project Structure (look for title or h1)
            const projMatch = docText.match(/<title>Project Structure[^<]*<\/title>[\s\S]*?<body[^>]*>([\s\S]*?)<\/body>/i);
            if (projMatch) {
                originalContent['project-structure'] = projMatch[1];
                document.getElementById('project-structure').innerHTML = projMatch[1];
            }

            // Extract Database Hierarchy
            const hierMatch = docText.match(/<title>Database Hierarchy[^<]*<\/title>[\s\S]*?<body[^>]*>([\s\S]*?)<\/body>/i);
            if (hierMatch) {
                originalContent['database-hierarchy'] = hierMatch[1];
                document.getElementById('database-hierarchy').innerHTML = hierMatch[1];
            }

            // Extract Database Schema
            const schemaMatch = docText.match(/<title>Database Schema Documentation[^<]*<\/title>[\s\S]*?<body[^>]*>([\s\S]*?)<\/body>/i);
            if (schemaMatch) {
                originalContent['database-schema'] = schemaMatch[1];
                document.getElementById('database-schema').innerHTML = schemaMatch[1];
            }

            // Extract Visualization (the main D3.js code)
            const vizContent = docText.match(/<div class="loading"[^<]*<\/div>[\s\S]*?<script[\s\S]*?d3\.js[\s\S]*?<\/script>/i);
            if (vizContent) {
                // Keep the original visualization content
                const vizDiv = document.createElement('div');
                vizDiv.innerHTML = `<div id="canvas-container"></div>`;
                originalContent['database-visualization'] = vizDiv.innerHTML;
            }
        }

        // Tab switching function
        function switchTab(tabId) {
            // Remove active class from all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Add active class to clicked tab and button
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            // Load content if not already loaded
            if (!originalContent[tabId]) {
                loadTabContent(tabId);
            }

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Load content for specific tab
        function loadTabContent(tabId) {
            const tabElement = document.getElementById(tabId);
            
            // Show loading state
            tabElement.innerHTML = '<div class="loading">Loading content...</div>';

            // Simulate async loading (you can replace with actual fetch if needed)
            setTimeout(() => {
                if (tabId === 'database-visualization') {
                    // For visualization, initialize D3.js
                    tabElement.innerHTML = `
                        <div id="canvas-container" style="width: 100%; height: calc(100vh - 70px);"></div>
                        <script>
                            // Your original D3.js visualization code goes here
                            console.log('D3.js Visualization initialized');
                        <\/script>
                    `;
                } else {
                    tabElement.innerHTML = `<div class="loading">Content for ${tabId} not found. Please ensure the HTML is properly embedded.</div>`;
                }
            }, 300);
        }

        // Theme toggle function
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark';
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const tabs = ['project-structure', 'database-hierarchy', 'database-schema', 'database-visualization'];
            const currentTab = document.querySelector('.tab-content.active');
            const currentIndex = tabs.indexOf(currentTab.id);

            if (e.key === 'ArrowRight' && currentIndex < tabs.length - 1) {
                const nextBtn = document.querySelectorAll('.tab-btn')[currentIndex + 1];
                nextBtn.click();
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                const prevBtn = document.querySelectorAll('.tab-btn')[currentIndex - 1];
                prevBtn.click();
            }
        });
    </script>
</body>
</html>
