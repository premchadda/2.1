<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Schema Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252540;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent: #4ecdc4;
            --accent-hover: #3dbdb5;
            --border: rgba(255,255,255,0.1);
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }
        
        #canvas-container { width: 100%; height: 100vh; position: relative; }
        #schema-svg { width: 100%; height: 100%; display: block; }
        
        .link { fill: none; stroke-width: 2px; stroke-linecap: round; opacity: 0.6; pointer-events: stroke; cursor: pointer; }
        .link:hover { stroke-width: 4px; opacity: 1; }
        .link-label { font-size: 8px; fill: #a0a0b0; pointer-events: none; }
        .node { cursor: pointer; }
        .node:hover rect { filter: drop-shadow(0 0 15px currentColor); }
        .node.highlighted rect { stroke-width: 3px; stroke: #fff; }
        .node.dimmed { opacity: 0.2; }
        .link.highlighted { stroke-width: 3px; opacity: 1; }
        .link.dimmed { opacity: 0.1; }
        .node rect { transition: all 0.3s ease; }
        .node text { fill: white; font-size: 11px; font-weight: 600; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
        .node .row-count { fill: rgba(255,255,255,0.8); font-size: 9px; font-weight: 400; }
        
        .legend {
            position: absolute; left: 20px; top: 20px; background: rgba(26, 26, 46, 0.95);
            border-radius: 12px; padding: 16px; max-height: calc(100vh - 40px); overflow-y: auto;
            border: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100; min-width: 280px;
        }
        .legend h3 { font-size: 14px; margin-bottom: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        
        .view-toggle {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        .view-btn {
            flex: 1; padding: 8px 12px; border: 1px solid var(--border); background: var(--bg-tertiary);
            color: var(--text-secondary); border-radius: 6px; cursor: pointer; font-size: 11px;
            transition: all 0.2s; text-align: center;
        }
        .view-btn.active {
            background: var(--accent); color: var(--bg-primary); border-color: var(--accent);
        }
        .view-btn:hover:not(.active) {
            background: rgba(78, 205, 196, 0.2); border-color: var(--accent);
        }
        
        .category-section {
            margin-bottom: 16px;
        }
        .category-header {
            display: flex; align-items: center; gap: 8px; padding: 8px 0;
            cursor: pointer; user-select: none;
        }
        .category-header:hover { opacity: 0.8; }
        .category-icon {
            width: 24px; height: 24px; border-radius: 4px; display: flex;
            align-items: center; justify-content: center; font-size: 12px;
        }
        .category-name { font-size: 12px; font-weight: 600; flex: 1; }
        .category-count {
            font-size: 10px; color: var(--text-secondary); background: rgba(255,255,255,0.1);
            padding: 2px 8px; border-radius: 10px;
        }
        .category-arrow {
            font-size: 10px; color: var(--text-secondary); transition: transform 0.2s;
        }
        .category-arrow.expanded { transform: rotate(90deg); }
        
        .category-tables {
            display: none; margin-left: 32px; margin-top: 4px;
        }
        .category-tables.expanded { display: block; }
        
        .legend-item {
            display: flex; align-items: center; gap: 10px; padding: 6px 8px;
            font-size: 12px; cursor: pointer; transition: all 0.2s; border-radius: 6px;
        }
        .legend-item:hover { background: rgba(78, 205, 196, 0.15); transform: translateX(5px); }
        .legend-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
        .legend-name { flex: 1; }
        .legend-count {
            font-size: 10px; color: var(--text-secondary); background: rgba(255,255,255,0.1);
            padding: 2px 6px; border-radius: 10px;
        }
        
        .tooltip {
            position: absolute; background: rgba(15, 15, 26, 0.98); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; padding: 12px; pointer-events: none; opacity: 0; transition: opacity 0.2s;
            z-index: 1000; max-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .tooltip.visible { opacity: 1; }
        .tooltip h4 { color: #fff; margin-bottom: 8px; font-size: 14px; }
        .tooltip p { color: var(--text-secondary); font-size: 11px; margin: 4px 0; }
        .tooltip .columns-list { max-height: 150px; overflow-y: auto; margin-top: 8px; }
        .tooltip .col-item { display: flex; justify-content: space-between; padding: 3px 0; font-size: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tooltip .col-name { color: #4ecdc4; }
        .tooltip .col-type { color: var(--text-secondary); }
        
        .controls { position: absolute; right: 20px; top: 20px; display: flex; gap: 10px; z-index: 100; }
        .control-btn {
            background: rgba(26, 26, 46, 0.95); border: 1px solid rgba(255,255,255,0.1); color: white;
            padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .control-btn:hover { background: rgba(78, 205, 196, 0.3); border-color: #4ecdc4; }
        
        .stats-panel {
            position: absolute; right: 20px; bottom: 20px; background: rgba(26, 26, 46, 0.95);
            border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }
        .stats-panel h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .stats-panel .stat { font-size: 24px; font-weight: bold; color: #4ecdc4; }
        .stats-panel .stat-label { font-size: 10px; color: var(--text-secondary); }
        
        .search-box { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); z-index: 100; }
        .search-box input {
            background: rgba(26, 26, 46, 0.95); border: 1px solid rgba(255,255,255,0.1); color: white;
            padding: 10px 16px; border-radius: 8px; width: 300px; font-size: 13px; outline: none;
        }
        .search-box input:focus { border-color: #4ecdc4; }
        .search-box input::placeholder { color: var(--text-secondary); }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes flow { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
        .link-animated { stroke-dasharray: 5, 10; animation: flow 1s linear infinite; }
        
        .loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-primary);
            display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 9999;
        }
        .loading-spinner {
            width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #4ecdc4;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { margin-top: 20px; color: var(--text-secondary); }
        
        .relations-panel {
            position: absolute; left: 20px; bottom: 20px; background: rgba(26, 26, 46, 0.95);
            border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); z-index: 100;
            max-width: 350px; max-height: 400px; overflow: hidden; display: flex; flex-direction: column;
        }
        .relations-panel h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .relations-search { margin-bottom: 8px; }
        .relations-search input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 6px 10px; border-radius: 6px; font-size: 11px; outline: none;
        }
        .relations-search input:focus { border-color: #4ecdc4; }
        .relations-list { overflow-y: auto; flex: 1; }
        .relation-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px;
            font-size: 10px; cursor: pointer; transition: all 0.2s; border-radius: 6px; margin-bottom: 4px;
        }
        .relation-item:hover { background: rgba(78, 205, 196, 0.15); }
        .relation-from { color: #4ecdc4; font-weight: 600; flex: 1; text-align: right; }
        .relation-arrow { color: #a0a0b0; font-size: 12px; }
        .relation-to { color: #8b5cf6; font-weight: 600; flex: 1; }
        .relation-column { color: #a0a0b0; font-size: 9px; margin-left: 4px; }
        
        /* Category Colors */
        .cat-users { background: #3b82f6; }
        .cat-exams { background: #8b5cf6; }
        .cat-tests { background: #10b981; }
        .cat-questions { background: #f59e0b; }
        .cat-study { background: #ec4899; }
        .cat-subjects { background: #06b6d4; }
        .cat-attempts { background: #ef4444; }
        .cat-subscriptions { background: #84cc16; }
        .cat-notifications { background: #f97316; }
        .cat-system { background: #6366f1; }
        .cat-social { background: #14b8a6; }
        .cat-media { background: #a855f7; }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>Loading database schema...</p>
    </div>
    
    <div id="canvas-container">
        <svg id="schema-svg"></svg>
    </div>
    
    <div class="legend" id="legend">
        <h3>Database Tables</h3>
        <div class="view-toggle">
            <button class="view-btn active" id="view-category" onclick="setView('category')">📂 By Category</button>
            <button class="view-btn" id="view-name" onclick="setView('name')">📋 By Name</button>
        </div>
        <div id="tables-container"></div>
    </div>
    
    <div class="search-box">
        <input type="text" id="search" placeholder="Search tables..." oninput="filterTables(this.value)">
    </div>
    
    <div class="controls">
        <button class="control-btn" id="zoom-in">Zoom In</button>
        <button class="control-btn" id="zoom-out">Zoom Out</button>
        <button class="control-btn" id="reset">Reset</button>
        <button class="control-btn" id="toggle-animations">Pause Animations</button>
    </div>
    
    <div class="stats-panel">
        <h4>Database Stats</h4>
        <div class="stat" id="table-count">0</div>
        <div class="stat-label">Tables</div>
        <div class="stat" id="relation-count" style="margin-top:10px;">0</div>
        <div class="stat-label">Relations</div>
    </div>
    
    <div class="relations-panel" id="relations-panel">
        <h4>🔗 Relationships</h4>
        <div class="relations-search">
            <input type="text" id="relations-search" placeholder="Filter relationships..." oninput="filterRelations(this.value)">
        </div>
        <div class="relations-list" id="relations-list"></div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>

        let currentView = 'category';
        let expandedCategories = new Set(Object.keys(tableCategories));
        let simulation;
        let svg, g;
        let zoom;
        let animationsPaused = false;

        // Get category for a table
        function getTableCategory(tableName) {
            for (const [category, info] of Object.entries(tableCategories)) {
                if (info.tables.includes(tableName)) {
                    return { category, ...info };
                }
            }
            return { category: 'Other', color: '#64748b', icon: '📦' };
        }

        // Initialize D3 visualization
        function initVisualization() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            svg = d3.select('#schema-svg')
                .attr('width', width)
                .attr('height', height);

            // Add zoom behavior
            zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });

            svg.call(zoom);

            // Add arrow marker for directed edges
            svg.append('defs').append('marker')
                .attr('id', 'arrowhead')
                .attr('viewBox', '-0 -5 10 10')
                .attr('refX', 20)
                .attr('refY', 0)
                .attr('orient', 'auto')
                .attr('markerWidth', 6)
                .attr('markerHeight', 6)
                .append('path')
                .attr('d', 'M 0,-5 L 10 ,0 L 0,5')
                .attr('fill', '#4ecdc4')
                .style('stroke', 'none');

            g = svg.append('g');

            // Prepare nodes and links
            const tables = Object.keys(databaseData.tables);
            const nodes = tables.map(table => {
                const cat = getTableCategory(table);
                const tableData = databaseData.tables[table];
                return {
                    id: table,
                    color: cat.color,
                    icon: cat.icon,
                    columns: tableData.columns,
                    primaryKey: tableData.primaryKey,
                    foreignKeys: tableData.foreignKeys,
                    rowCount: tableData.rowCount
                };
            });

            const links = [];
            tables.forEach(table => {
                const tableData = databaseData.tables[table];
                if (tableData.foreignKeys) {
                    tableData.foreignKeys.forEach(fk => {
                        if (databaseData.tables[fk.foreign_table]) {
                            links.push({
                                source: table,
                                target: fk.foreign_table,
                                column: fk.column_name,
                                foreignColumn: fk.foreign_column
                            });
                        }
                    });
                }
            });

            // Update stats
            document.getElementById('table-count').textContent = nodes.length;
            document.getElementById('relation-count').textContent = links.length;

            // Create force simulation
            simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(150))
                .force('charge', d3.forceManyBody().strength(-800))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(80));

            // Create links
            const link = g.append('g')
                .attr('class', 'links')
                .selectAll('path')
                .data(links)
                .enter()
                .append('path')
                .attr('class', 'link')
                .attr('stroke', d => {
                    const sourceCat = getTableCategory(d.source.id || d.source);
                    return sourceCat.color;
                })
                .attr('marker-end', 'url(#arrowhead)');

            // Create nodes
            const node = g.append('g')
                .attr('class', 'nodes')
                .selectAll('g')
                .data(nodes)
                .enter()
                .append('g')
                .attr('class', 'node')
                .attr('data-table', d => d.id)
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended))
                .on('mouseover', showTooltip)
                .on('mouseout', hideTooltip)
                .on('click', (event, d) => highlightTable(d.id));

            // Add rectangles for nodes
            node.append('rect')
                .attr('width', 140)
                .attr('height', 40)
                .attr('x', -70)
                .attr('y', -20)
                .attr('rx', 8)
                .attr('ry', 8)
                .attr('fill', d => d.color)
                .attr('stroke', 'rgba(255,255,255,0.3)')
                .attr('stroke-width', 1);

            // Add table name text
            node.append('text')
                .attr('dy', -2)
                .attr('font-size', '11px')
                .attr('font-weight', '600')
                .text(d => d.id.length > 16 ? d.id.substring(0, 14) + '...' : d.id);

            // Add column count
            node.append('text')
                .attr('class', 'row-count')
                .attr('dy', 12)
                .attr('font-size', '9px')
                .text(d => `${d.columns.length} columns`);

            // Update positions on tick
            simulation.on('tick', () => {
                link.attr('d', d => {
                    const dx = d.target.x - d.source.x;
                    const dy = d.target.y - d.source.y;
                    const dr = Math.sqrt(dx * dx + dy * dy) * 2;
                    return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
                });

                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });

            // Zoom controls
            document.getElementById('zoom-in').addEventListener('click', () => {
                svg.transition().call(zoom.scaleBy, 1.3);
            });

            document.getElementById('zoom-out').addEventListener('click', () => {
                svg.transition().call(zoom.scaleBy, 0.7);
            });

            document.getElementById('reset').addEventListener('click', () => {
                svg.transition().call(zoom.transform, d3.zoomIdentity);
            });

            document.getElementById('toggle-animations').addEventListener('click', function() {
                animationsPaused = !animationsPaused;
                if (animationsPaused) {
                    simulation.stop();
                    this.textContent = '▶ Resume Animations';
                } else {
                    simulation.restart();
                    this.textContent = '⏸ Pause Animations';
                }
            });
        }

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Tooltip functions
        function showTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            const columnsHtml = d.columns.slice(0, 10).map(col => {
                const isPK = d.primaryKey && d.primaryKey.includes(col.column_name);
                const isFK = d.foreignKeys && d.foreignKeys.some(fk => fk.column_name === col.column_name);
                let badge = '';
                if (isPK) badge = ' <span style="color:#f59e0b;">PK</span>';
                if (isFK) badge += ' <span style="color:#3b82f6;">FK</span>';
                return `<div class="col-item"><span class="col-name">${col.column_name}${badge}</span><span class="col-type">${col.data_type}</span></div>`;
            }).join('');

            const fkHtml = d.foreignKeys && d.foreignKeys.length > 0 ? 
                `<p style="margin-top:8px;color:#3b82f6;font-weight:600;">Foreign Keys:</p>
                ${d.foreignKeys.map(fk => `<div class="col-item"><span class="col-name">${fk.column_name}</span><span class="col-type">→ ${fk.foreign_table}.${fk.foreign_column}</span></div>`).join('')}` : '';

            tooltip.innerHTML = `
                <h4>${d.icon} ${d.id}</h4>
                <p>Columns: ${d.columns.length}</p>
                ${d.primaryKey && d.primaryKey.length > 0 ? `<p>Primary Key: ${d.primaryKey.join(', ')}</p>` : ''}
                <div class="columns-list">${columnsHtml}${d.columns.length > 10 ? `<p style="color:#a0a0b0;font-size:10px;">...and ${d.columns.length - 10} more</p>` : ''}</div>
                ${fkHtml}
            `;
            tooltip.classList.add('visible');
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 10) + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('visible');
        }

        // Initialize view
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
            renderSidebar();
        }

        function toggleCategory(category) {
            if (expandedCategories.has(category)) {
                expandedCategories.delete(category);
            } else {
                expandedCategories.add(category);
            }
            renderSidebar();
        }

        function filterTables(query) {
            const lowerQuery = query.toLowerCase();
            document.querySelectorAll('.legend-item').forEach(item => {
                const name = item.dataset.tableName.toLowerCase();
                item.style.display = name.includes(lowerQuery) ? 'flex' : 'none';
            });
            document.querySelectorAll('.category-section').forEach(section => {
                const hasVisible = Array.from(section.querySelectorAll('.legend-item'))
                    .some(item => item.style.display !== 'none');
                section.style.display = hasVisible ? 'block' : 'none';
            });
        }

        function renderSidebar() {
            const container = document.getElementById('tables-container');
            container.innerHTML = '';

            if (currentView === 'category') {
                Object.entries(tableCategories).forEach(([category, info]) => {
                    const section = document.createElement('div');
                    section.className = 'category-section';
                    
                    const isExpanded = expandedCategories.has(category);
                    const tableCount = info.tables.filter(t => databaseData.tables[t]).length;
                    
                    section.innerHTML = `
                        <div class="category-header" onclick="toggleCategory('${category}')">
                            <span class="category-icon" style="background:${info.color}">${info.icon}</span>
                            <span class="category-name">${category}</span>
                            <span class="category-count">${tableCount}</span>
                            <span class="category-arrow ${isExpanded ? 'expanded' : ''}">▶</span>
                        </div>
                        <div class="category-tables ${isExpanded ? 'expanded' : ''}">
                            ${info.tables.filter(t => databaseData.tables[t]).map(table => `
                                <div class="legend-item" data-table-name="${table}" onclick="highlightTable('${table}')">
                                    <span class="legend-swatch" style="background:${info.color}"></span>
                                    <span class="legend-name">${table}</span>
                                    <span class="legend-count">${databaseData.tables[table]?.columns?.length || 0} cols</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                });
            } else {
                // Alphabetical view
                const sortedTables = Object.keys(databaseData.tables).sort();
                sortedTables.forEach(table => {
                    const category = Object.entries(tableCategories).find(([cat, info]) => 
                        info.tables.includes(table)
                    );
                    const color = category ? category[1].color : '#64748b';
                    
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    item.dataset.tableName = table;
                    item.onclick = () => highlightTable(table);
                    item.innerHTML = `
                        <span class="legend-swatch" style="background:${color}"></span>
                        <span class="legend-name">${table}</span>
                        <span class="legend-count">${databaseData.tables[table]?.columns?.length || 0} cols</span>
                    `;
                    container.appendChild(item);
                });
            }
        }

        function highlightTable(tableName) {
            // Highlight node in visualization
            d3.selectAll('.node').classed('dimmed', true);
            d3.select(`.node[data-table="${tableName}"]`).classed('dimmed', false).classed('highlighted', true);
            
            // Highlight connected links and their target/source tables
            d3.selectAll('.link').classed('dimmed', true);
            d3.selectAll('.link').filter(d => {
                if (d.source.id === tableName || d.target.id === tableName) {
                    // Also highlight the connected table
                    const connectedTable = d.source.id === tableName ? d.target.id : d.source.id;
                    d3.select(`.node[data-table="${connectedTable}"]`).classed('dimmed', false);
                    return true;
                }
                return false;
            }).classed('dimmed', false).classed('highlighted', true);
            
            setTimeout(() => {
                d3.selectAll('.node').classed('dimmed', false).classed('highlighted', false);
                d3.selectAll('.link').classed('dimmed', false).classed('highlighted', false);
            }, 3000);
        }

        // Populate relationships panel
        function populateRelationsPanel() {
            const relationsList = document.getElementById('relations-list');
            const links = [];
            
            Object.keys(databaseData.tables).forEach(table => {
                const tableData = databaseData.tables[table];
                if (tableData.foreignKeys) {
                    tableData.foreignKeys.forEach(fk => {
                        if (databaseData.tables[fk.foreign_table]) {
                            links.push({
                                from: table,
                                to: fk.foreign_table,
                                column: fk.column_name,
                                foreignColumn: fk.foreign_column
                            });
                        }
                    });
                }
            });
            
            // Sort alphabetically by source table
            links.sort((a, b) => a.from.localeCompare(b.from));
            
            relationsList.innerHTML = links.map(link => `
                <div class="relation-item" onclick="highlightRelation('${link.from}', '${link.to}')">
                    <span class="relation-from">${link.from}</span>
                    <span class="relation-column">.${link.column}</span>
                    <span class="relation-arrow">→</span>
                    <span class="relation-to">${link.to}</span>
                    <span class="relation-column">.${link.foreignColumn}</span>
                </div>
            `).join('');
        }
        
        function highlightRelation(fromTable, toTable) {
            // Highlight both tables and their connection
            d3.selectAll('.node').classed('dimmed', true);
            d3.select(`.node[data-table="${fromTable}"]`).classed('dimmed', false).classed('highlighted', true);
            d3.select(`.node[data-table="${toTable}"]`).classed('dimmed', false).classed('highlighted', true);
            
            d3.selectAll('.link').classed('dimmed', true);
            d3.selectAll('.link').filter(d => 
                (d.source.id === fromTable && d.target.id === toTable) ||
                (d.source.id === toTable && d.target.id === fromTable)
            ).classed('dimmed', false).classed('highlighted', true);
            
            setTimeout(() => {
                d3.selectAll('.node').classed('dimmed', false).classed('highlighted', false);
                d3.selectAll('.link').classed('dimmed', false).classed('highlighted', false);
            }, 3000);
        }
        
        function filterRelations(query) {
            const lowerQuery = query.toLowerCase();
            document.querySelectorAll('.relation-item').forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(lowerQuery) ? 'flex' : 'none';
            });
        }

        // Initialize
        renderSidebar();
        initVisualization();
        populateRelationsPanel();
        
        // Hide loading after a short delay
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 1500);
    </script>
</body>
</html>
