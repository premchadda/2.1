<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trstprep Database Schema Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .header .subtitle { color: #888; font-size: 12px; margin-bottom: 15px; }
        .search-box { margin: 15px 0; }

        .search-box input:focus { outline: none; box-shadow: 0 0 15px rgba(0,212,255,0.3); }

        .stats { display: flex; justify-content: center; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
        .stat { background: rgba(0,212,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 13px; }
        .stat span { color: #00d4ff; font-weight: bold; }
        .container { display: flex; padding: 20px; gap: 20px; height: calc(100vh - 150px); }
        .sidebar { width: 250px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow-y: auto; padding: 15px; flex-shrink: 0; }
        .sidebar h3 { color: #00d4ff; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .category { margin-bottom: 12px; }
        .category-title { color: #ffd700; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding: 6px 8px; background: rgba(255,215,0,0.1); border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; }
        .category-title:hover { background: rgba(255,215,0,0.2); }
        .category-tables { overflow: hidden; }
        .category-tables.collapsed { max-height: 0; }
        .table-link { display: block; padding: 7px 12px; color: #b0b0b0; text-decoration: none; border-radius: 5px; margin-bottom: 2px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .table-link:hover { background: rgba(0,212,255,0.2); color: #fff; }
        .table-link.active { background: rgba(0,212,255,0.3); color: #00d4ff; }
        .table-link .row-count { float: right; color: #666; font-size: 10px; }
        .main-content { flex: 1; overflow-y: auto; min-width: 0; }
        .view-toggle { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .view-btn { padding: 10px 20px; border: none; border-radius: 20px; background: rgba(0,212,255,0.2); color: #00d4ff; cursor: pointer; transition: all 0.2s; font-size: 13px; }
        .view-btn:hover, .view-btn.active { background: #00d4ff; color: #000; }
        .hidden { display: none !important; }
        .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .overview-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 18px; border: 1px solid #333; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .overview-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,212,255,0.15); }
        .overview-card h3 { color: #00d4ff; margin-bottom: 8px; font-size: 14px; word-break: break-word; }
        .overview-card .count { font-size: 28px; color: #ffd700; }
        .overview-card p { color: #888; font-size: 11px; margin-top: 5px; }
        .table-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid #00d4ff; flex-wrap: wrap; gap: 10px; }
        .table-name { font-size: 20px; color: #00d4ff; }
        .table-meta { display: flex; gap: 10px; flex-wrap: wrap; }
        .meta-badge { background: rgba(0,212,255,0.2); padding: 4px 12px; border-radius: 12px; font-size: 11px; }
        .columns-section h4 { color: #ffd700; margin-bottom: 12px; font-size: 14px; }
        .columns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
        .column { background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .column-name { font-weight: bold; color: #fff; flex: 1; min-width: 80px; font-size: 13px; }
        .column-type { color: #888; font-size: 11px; font-family: monospace; }
        .column-pk { background: #ffd700; color: #000; padding: 2px 6px; border-radius: 8px; font-size: 9px; font-weight: bold; }
        .column-fk { background: #ff6b6b; color: #fff; padding: 2px 6px; border-radius: 8px; font-size: 9px; font-weight: bold; cursor: pointer; }
        .column-fk:hover { background: #ff8585; }
        .column-nullable { color: #666; font-size: 10px; }
        .relations-section { margin-top: 18px; padding-top: 12px; border-top: 1px solid #333; }
        .relations-section h4 { color: #ffd700; margin-bottom: 10px; font-size: 14px; }
        .relation { background: rgba(255,107,107,0.1); padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
        .relation-arrow { color: #ff6b6b; }
        .relation-target { color: #00d4ff; cursor: pointer; }
        .relation-target:hover { text-decoration: underline; }
        .er-diagram { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 25px; overflow: auto; }
        .er-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .er-row-label { width: 100%; color: #ffd700; font-size: 13px; font-weight: bold; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333; }
        .er-table { display: inline-block; background: rgba(255,255,255,0.05); border: 2px solid #00d4ff; border-radius: 8px; min-width: 180px; vertical-align: top; cursor: pointer; transition: transform 0.2s; }
        .er-table:hover { transform: translateY(-2px); }
        .er-table-header { background: rgba(0,212,255,0.2); padding: 8px 12px; border-bottom: 1px solid #00d4ff; font-weight: bold; color: #00d4ff; display: flex; justify-content: space-between; font-size: 12px; }
        .er-table-header .row-count { font-size: 10px; color: #888; font-weight: normal; }
        .er-table-columns { padding: 8px; max-height: 200px; overflow-y: auto; }
        .er-column { padding: 4px 8px; font-size: 11px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .er-column:last-child { border-bottom: none; }
        .er-column-type { color: #888; font-size: 9px; }
        @media (max-width: 768px) {
            .container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; max-height: 250px; }
            .columns-grid { grid-template-columns: 1fr; }
            .search-box input { width: 100%; max-width: 280px; }
        }
    </style>
</head>

    <div class="header">
        <h1>📊 Trstprep Database Schema</h1>
        <div class="subtitle" id="exportDate">Export: 2026-04-16</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search tables, columns...">
        </div>
        <div class="stats">

            <div class="stat">Relations: <span id="relationCount">0</span></div>
            <div class="stat">Rows: <span id="totalRows">0</span></div>

    <div class="container">

            <h3>📋 Tables</h3>
            <div id="tableList"></div>

            <div id="erView" class="hidden"><div class="er-diagram" id="erDiagram"></div></div>
        </div>
    </div>

        }
    };

    // Parse column definition
    function parseColumn(colDef) {
        const parts = colDef.split(':');
        return { name: parts[0], type: parts[1] || 'unknown' };
    }

    // Get all tables sorted
    const tableNames = Object.keys(schemaData.tables).sort();
    let currentView = 'overview';
    let currentTable = null;

    // Calculate stats
    let totalCols = 0, totalFK = 0, totalRows = 0;
    tableNames.forEach(name => {
        const t = schemaData.tables[name];
        totalCols += t.columns.length;
        totalFK += t.fk.length;
        totalRows += t.rows;
    });

    document.getElementById('tableCount').textContent = tableNames.length;
    document.getElementById('columnCount').textContent = totalCols;
    document.getElementById('relationCount').textContent = totalFK;
    document.getElementById('totalRows').textContent = totalRows.toLocaleString();

    // Group by category
    const categories = {};
    tableNames.forEach(name => {
        const cat = schemaData.tables[name].cat || 'Other';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(name);
    });

    // Render sidebar
    const tableList = document.getElementById('tableList');
    Object.keys(categories).sort().forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';
        catDiv.innerHTML = `<div class="category-title" onclick="toggleCat(this)">${cat}<span>${categories[cat].length}</span></div><div class="category-tables"></div>`;
        const tablesDiv = catDiv.querySelector('.category-tables');
        categories[cat].forEach(name => {
            const t = schemaData.tables[name];
            const link = document.createElement('a');
            link.className = 'table-link';
            link.innerHTML = `${name}<span class="row-count">${t.rows}</span>`;
            link.onclick = () => showTable(name);
            tablesDiv.appendChild(link);
        });
        tableList.appendChild(catDiv);
    });

    function toggleCat(el) { el.nextElementSibling.classList.toggle('collapsed'); }

    // Render overview
    const grid = document.getElementById('overviewGrid');
    tableNames.slice().sort((a, b) => schemaData.tables[b].rows - schemaData.tables[a].rows).forEach(name => {
        const t = schemaData.tables[name];
        const card = document.createElement('div');
        card.className = 'overview-card';
        card.onclick = () => showTable(name);
        card.innerHTML = `<h3>${name}</h3><div class="count">${t.rows}</div><p>${t.columns.length} cols • ${t.pk.length} PK • ${t.fk.length} FK</p>`;
        grid.appendChild(card);
    });

    // Show table
    function showTable(name) {
        currentTable = name;
        showView('tables');
        const t = schemaData.tables[name];
        const details = document.getElementById('tableDetails');

        let colsHtml = t.columns.map(colDef => {
            const col = parseColumn(colDef);
            const isPK = t.pk.includes(col.name);
            const fkMatch = t.fk.find(f => f.startsWith(col.name + '→'));
            const fkTarget = fkMatch ? fkMatch.split('→')[1] : null;
            return `<div class="column">
                <span class="column-name">${col.name}</span>
                <span class="column-type">${col.type}</span>
                ${isPK ? '<span class="column-pk">PK</span>' : ''}
                ${fkTarget ? `<span class="column-fk" onclick="showTable('${fkTarget.split('.')[0]}')">FK→${fkTarget}</span>` : ''}
            </div>`;
        }).join('');

        let fkHtml = '';
        if (t.fk.length > 0) {
            fkHtml = `<div class="relations-section"><h4>🔗 Foreign Keys</h4>${t.fk.map(fk => {
                const [col, target] = fk.split('→');
                const [targetTable] = target.split('.');
                return `<div class="relation"><span>${col}</span><span class="relation-arrow">→</span><span class="relation-target" onclick="showTable('${targetTable}')">${target}</span></div>`;
            }).join('')}</div>`;
        }

        // Incoming relations
        let incomingHtml = '';
        const incoming = [];
        tableNames.forEach(otherName => {
            if (otherName === name) return;
            schemaData.tables[otherName].fk.forEach(fk => {
                const target = fk.split('→')[1];
                if (target.startsWith(name + '.')) {
                    incoming.push({ table: otherName, fk: fk });
                }
            });
        });
        if (incoming.length > 0) {
            incomingHtml = `<div class="relations-section"><h4>🔗 Referenced By</h4>${incoming.map(ref => {
                const [col, target] = ref.fk.split('→');
                return `<div class="relation"><span class="relation-target" onclick="showTable('${ref.table}')">${ref.table}.${col}</span><span class="relation-arrow">→</span><span>${target}</span></div>`;
            }).join('')}</div>`;
        }

        details.innerHTML = `<div class="table-card">
            <div class="table-header">
                <div class="table-name">${name}</div>
                <div class="table-meta">
                    <span class="meta-badge">${t.columns.length} columns</span>
                    <span class="meta-badge">${t.rows} rows</span>
                    <span class="meta-badge">${t.cat}</span>
                </div>
            </div>
            <div class="columns-section"><h4>📝 Columns</h4><div class="columns-grid">${colsHtml}</div></div>
            ${fkHtml}${incomingHtml}
        </div>`;

        document.querySelectorAll('.table-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.table-link').forEach(l => { if (l.textContent.trim().startsWith(name)) l.classList.add('active'); });
    }

    // View toggle
    function showView(view) {
        currentView = view;
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        document.getElementById('overviewView').classList.add('hidden');
        document.getElementById('tablesView').classList.add('hidden');
        document.getElementById('erView').classList.add('hidden');
        document.getElementById(view === 'overview' ? 'overviewView' : view === 'tables' ? 'tablesView' : 'erView').classList.remove('hidden');
        if (view === 'er') renderER();
    }

    // ER Diagram
    function renderER() {
        const diagram = document.getElementById('erDiagram');
        const cats = Object.keys(categories).sort();
        let html = '';
        cats.forEach(cat => {
            html += `<div class="er-row-label">${cat}</div><div class="er-row">`;
            categories[cat].forEach(name => {
                const t = schemaData.tables[name];
                html += `<div class="er-table" onclick="showTable('${name}')">
                    <div class="er-table-header">${name}<span class="row-count">${t.rows}</span></div>
                    <div class="er-table-columns">${t.columns.slice(0, 6).map(colDef => {
                        const col = parseColumn(colDef);
                        const isPK = t.pk.includes(col.name);
                        const hasFK = t.fk.some(f => f.startsWith(col.name + '→'));
                        return `<div class="er-column"><span>${col.name}</span><div><span class="er-column-type">${col.type}</span>${isPK ? '<span class="column-pk">PK</span>' : ''}${hasFK ? '<span class="column-fk">FK</span>' : ''}</div></div>`;
                    }).join('')}${t.columns.length > 6 ? `<div class="er-column" style="color:#666">+${t.columns.length - 6} more</div>` : ''}</div></div>`;
            });
            html += '</div>';
        });
        diagram.innerHTML = html;
    }

    // Search
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.table-link').forEach(l => {
            const name = l.textContent.split(/\s+/)[0].toLowerCase();
            const t = schemaData.tables[name];
            let match = name.includes(q);
            if (t) match = match || t.columns.some(c => c.toLowerCase().includes(q));
            l.style.display = match ? 'block' : 'none';
        });
        if (q.length > 0) document.querySelectorAll('.category-tables').forEach(c => c.classList.remove('collapsed'));
    });
    </script>
