# ==============================================================================
# docker-compose.prod.yml — PRODUCTION OVERRIDE for docker-compose.yml
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NOTE: the base docker-compose.yml is ALREADY production-safe (built images,
# NODE_ENV=production, no host source mounts — dev mounts and the dev command
# live in docker-compose.dev.yml only). This file does NOT "productionize" a
# dev base; it only tightens the nginx-served frontends for production:
#   - backend-1 / backend-2: drop published ports (traffic enters via nginx),
#     run via `pnpm start` (production entrypoint, no --watch) with
#     NODE_ENV=production.
#   - frontend / admin-panel: drop published ports, serve via nginx
#     (`nginx -g 'daemon off;'`) from the built images.
#   - Infra services (postgres/redis/nginx/prometheus/grafana/loki) are
#     inherited unchanged from docker-compose.yml.
#
# docker-compose.scale.yml is DEPRECATED (reference only — see its header);
# horizontal scaling goes through scripts/scale.sh against base+prod.
# ==============================================================================

services:
  backend-1:
    volumes: []
    command: pnpm start
    ports: []
    environment:
      - NODE_ENV=production

  backend-2:
    volumes: []
    command: pnpm start
    ports: []
    environment:
      - NODE_ENV=production

  frontend:
    volumes: []
    command: nginx -g 'daemon off;'
    ports: []

  admin-panel:
    volumes: []
    command: nginx -g 'daemon off;'
    ports: []
