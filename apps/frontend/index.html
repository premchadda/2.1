<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, shrink-to-fit=no" />
    <meta name="description" content="Trstprep - India's #1 Platform for SSC & Railway Exam Preparation. Access 500+ Mock Tests, Live Tests, and Study Materials." />
    <meta name="keywords" content="SSC CGL, SSC CHSL, RRB NTPC, Railway Exams, Mock Tests, Online Test Series" />
    <meta name="author" content="Trstprep" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trstprep" />
    <meta name="application-name" content="Trstprep" />
    <meta name="msapplication-TileColor" content="#6366f1" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <meta name="msapplication-navbutton-color" content="#6366f1" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Trstprep - SSC & Railway Test Series" />
    <meta property="og:description" content="Prepare for SSC & Railway exams with 500+ mock tests, live tests, and comprehensive study materials." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icons/icon-512.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
    
    <title>Trstprep - SSC & Railway Test Series</title>

    <!-- Structured Data (JSON-LD) for Educational Organization & Mock Tests -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "https://trstprep.com/#organization",
            "name": "Trstprep",
            "url": "https://trstprep.com",
            "logo": "https://trstprep.com/icons/icon-512.png",
            "description": "India's premier test preparation platform for SSC CGL, CHSL, and Railway exams featuring 500+ full mocks, live national tests, and smart learning analytics.",
            "sameAs": [
              "https://t.me/trstprep"
            ]
          },
          {
            "@type": "Course",
            "@id": "https://trstprep.com/#course-ssc-railway",
            "name": "SSC & Railway Comprehensive Mock Test Series",
            "description": "Full-length mock tests, sectional speed drills, and PYP practice for SSC CGL, CHSL, MTS, and RRB NTPC.",
            "provider": {
              "@id": "https://trstprep.com/#organization"
            },
            "educationalCredentialAwarded": "Certificate of Completion",
            "hasCourseInstance": {
              "@type": "CourseInstance",
              "courseMode": "online"
            }
          }
        ]
      }
    </script>

    <!-- Apply theme + background before first paint to prevent white flash -->
    <style>
      html, body { background-color: #f8f9fa; }
      html.dark, html.dark body { background-color: #111827; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('trstprep_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
