http {
    # H27: nginx-level rate limiting zones (defense against DDoS / brute force)
    limit_req_zone $binary_remote_addr zone=fe_api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=fe_auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=fe_conn_limit:10m;

    server {
        listen 80;
        server_name _;
        server_tokens off;
        client_max_body_size 50m;

        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/html text/css application/json application/javascript application/manifest+json text/xml application/xml application/xml+rss text/javascript image/svg+xml;

        # Security headers — aligned with vercel.json CSP (H26 fix)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://checkout.razorpay.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://trstprep-v-1.onrender.com https://*.onrender.com wss://trstprep-v-1.onrender.com wss://*.onrender.com https://api.razorpay.com https://accounts.google.com https://*.supabase.co; object-src 'none'; frame-src 'self' https://accounts.google.com https://api.razorpay.com https://*.youtube.com https://*.youtube-nocookie.com https://drive.google.com; base-uri 'self';" always;

        # Proxy API requests to backend (H27: rate limited)
        location /api/ {
            limit_req zone=fe_api_limit burst=50 nodelay;
            limit_conn fe_conn_limit 50;

            proxy_pass http://backend:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy WebSocket connections
        location /socket.io/ {
            limit_conn fe_conn_limit 50;

            proxy_pass http://backend:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Static assets with long cache
        # NOTE: nginx `add_header` resets inheritance — must re-declare ALL security headers here (aligned with vercel.json)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://checkout.razorpay.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://trstprep-v-1.onrender.com https://*.onrender.com wss://trstprep-v-1.onrender.com wss://*.onrender.com https://api.razorpay.com https://accounts.google.com https://*.supabase.co; object-src 'none'; frame-src 'self' https://accounts.google.com https://api.razorpay.com https://*.youtube.com https://*.youtube-nocookie.com https://drive.google.com; base-uri 'self';" always;
            try_files $uri =404;
        }

        # SPA fallback — all routes serve index.html for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
