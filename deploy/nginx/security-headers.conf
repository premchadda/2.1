# ==============================================================================
# Trstprep Production Security Headers
# Included in server block and child location blocks to prevent Nginx
# add_header directive inheritance shadowing.
# ==============================================================================

# HSTS: Enforce HTTPS for 1 year, including subdomains and preloading
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# MIME Sniffing Protection
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking Protection
add_header X-Frame-Options "SAMEORIGIN" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (Aligned with apps/frontend/nginx.conf)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content Security Policy (Production-hardened, allowing Google Fonts and Razorpay)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https: https://api.razorpay.com https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
