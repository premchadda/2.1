worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream backend with least-connections load balancing
    upstream backend_servers {
        least_conn;
        server backend-1:5001 weight=1 max_fails=3 fail_timeout=30s;
        server backend-2:5001 weight=1 max_fails=3 fail_timeout=30s;
        server backend-3:5001 weight=1 max_fails=3 fail_timeout=30s;

        keepalive 64;
    }

    # Upstream for WebSocket sticky sessions
    upstream websocket_backend {
        ip_hash;
        server backend-1:5001;
        server backend-2:5001;
        server backend-3:5001;

        keepalive 64;
    }

    # Gzip compression
    # M47: Brotli is NOT available in stock nginx:alpine (no ngx_brotli module).
    # Enabling it would require a custom-built image (e.g. a brotli-enabled
    # nginx build). Gzip below is the working compression fallback for now.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Logging
    log_format upstream_log '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream=$upstream_addr '
                            'response_time=$upstream_response_time '
                            'request_id=$request_id';

    access_log /var/log/nginx/access.log upstream_log;
    error_log  /var/log/nginx/error.log warn;

    # Connection keep-alive settings
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Proxy buffer settings
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    # Redirect HTTP to HTTPS (except ACME http-01 challenge for certbot)
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 challenge — must NOT be redirected to HTTPS
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server block
    server {
        listen 443 ssl;
        server_name _;

        # ============================================================
        # FIX 2.2: SSL Certificate Configuration
        # ============================================================
        # PRODUCTION: Let's Encrypt certificates provisioned by the `certbot`
        # service (see docker-compose.yml). The live cert path is deterministic
        # via --cert-name trstprep.
        #   certbot certonly --webroot -w /var/www/certbot --cert-name trstprep \
        #     -d yourdomain.com --email admin@yourdomain.com --agree-tos
        #
        # DEVELOPMENT: self-signed certs can be mounted at the same path, e.g.
        #   /etc/nginx/certs/fullchain.pem + privkey.pem
        # ============================================================
        ssl_certificate     /etc/letsencrypt/live/trstprep/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trstprep/privkey.pem;
        # DEV FALLBACK (only used if the symlink above is absent in dev):
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS configuration (Mozilla Intermediate)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (requires valid CA-signed certificate)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # HSTS — enforce HTTPS for 1 year, include subdomains
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Production CSP: no 'unsafe-eval', no arbitrary http: egress.
        # 'unsafe-inline' is retained only because the SPA build does not yet
        # emit per-request nonces (tracked for follow-up hardening).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

        # Global proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Health check endpoint (no rate limit)
        location /api/health {
            proxy_pass http://backend_servers/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ============================================================
        # FIX 2.5: /metrics restricted to internal networks only
        # Prometheus scrapes from the monitoring-net (Docker internal).
        # External access is denied.
        # ============================================================
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://backend_servers/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # Auth endpoints with stricter rate limiting
        location ~ ^/api/(auth|login|register) {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header X-Request-ID $request_id always;
        }

        # WebSocket proxy with sticky sessions (ip_hash)
        location /socket.io {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Backend API with rate limiting and load balancing
        location /api {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            add_header X-Request-ID $request_id always;

            # Cache GET responses briefly
            proxy_cache_valid 200 10s;
        }

        # Static assets with immutable caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
            proxy_pass http://frontend:3000;
            expires 365d;
            add_header Cache-Control "public, no-transform, max-age=31536000, immutable";
            add_header X-CDN-Cache "HIT";
            add_header Vary "Accept-Encoding";
        }

        # Admin Panel
        location /admin {
            proxy_pass http://admin-panel:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # M55: nginx status endpoint for Prometheus scraping
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
            access_log off;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend:3000;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
