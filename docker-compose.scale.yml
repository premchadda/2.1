services:
  backend-1:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=https://localhost
      - ENFORCE_HTTPS=true
      - INSTANCE_ID=backend-1
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - backend-uploads:/app/uploads
      - backend-spool:/app/.email-spool
    command: npm run dev
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    depends_on:
      backend-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net

  backend-2:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5002:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=https://localhost
      - ENFORCE_HTTPS=true
      - INSTANCE_ID=backend-2
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - backend-uploads:/app/uploads
      - backend-spool:/app/.email-spool
    command: npm run dev
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    depends_on:
      backend-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net

  backend-3:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5003:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=https://localhost
      - ENFORCE_HTTPS=true
      - INSTANCE_ID=backend-3
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - backend-uploads:/app/uploads
      - backend-spool:/app/.email-spool
    command: npm run dev
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    depends_on:
      backend-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - VITE_API_URL=https://localhost/api
      - VITE_SOCKET_URL=https://localhost
      - VITE_ADMIN_URL=https://localhost/admin
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    command: npm run dev
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - backend-net

  admin-panel:
    build:
      context: ./apps/admin-panel
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - VITE_API_URL=https://localhost/api
      - VITE_MAIN_SITE_URL=https://localhost
    volumes:
      - ./apps/admin-panel:/app
      - /app/node_modules
    depends_on:
      backend-1:
        condition: service_healthy
    command: npm run dev
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - backend-net

  nginx:
    image: nginx:1.27.3-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      - frontend
      - backend-1
      - backend-2
      - backend-3
      - admin-panel
    restart: unless-stopped
    networks:
      - backend-net

  backend-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-testprep}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - backend-net

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped
    networks:
      - backend-net

  grafana:
    image: grafana/grafana-oss:11.1.0
    ports:
      - "127.0.0.1:3003:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - backend-net

volumes:
  pgdata:
  redisdata:
  backend-uploads:
  backend-spool:

networks:
  backend-net:
    driver: bridge
