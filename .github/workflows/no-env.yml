name: No env files

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  check-no-env:
    name: Block .env files in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the full history so pre-commit-ignore checks still see new tracked files
          fetch-depth: 0
      - name: Check for tracked .env files
        run: |
          set -euo pipefail
          echo "::group::Tracked .env file scan"
          if git ls-files | grep -E '(^|/)\.env(\.[^.]+)?$|\.envrc$'; then
            echo "::error::A .env file is tracked by git. Remove it with 'git rm --cached <path>' and rotate the secrets."
            echo "::error::See docs/SECRET_ROTATION_RUNBOOK_2026-06-15.md for the rotation procedure."
            exit 1
          fi
          echo "No tracked .env files found ✓"
          echo "::endgroup::"

      - name: Check for hard-coded secret patterns in committed code
        run: |
          set -euo pipefail
          echo "::group::Secret pattern scan"
          FAILED=0

          # Match common secret prefixes in committed source (exclude .env.example placeholders, lockfiles, node_modules, docs, supabase_data)
          MATCHES=$(git ls-files \
            | grep -vE '(^|/)(node_modules|dist|coverage|supabase_data|\.gitignore|\.husky|docs/archive|docs/database/Open)' \
            | grep -vE '\.(lock|example|md|html|sql|css|png|jpg|jpeg|svg|ico|woff2?|ttf|map|json)$' \
            | xargs -r grep -lE '(BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|sk-or-v1-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[abp]-[A-Za-z0-9-]+)' 2>/dev/null || true)

          if [ -n "$MATCHES" ]; then
            echo "::error::Possible hard-coded secret detected in:"
            echo "$MATCHES"
            FAILED=1
          fi

          # Match JWT secrets that look real (>= 32 chars and not the placeholder)
          JWT_MATCHES=$(git ls-files \
            | grep -vE '(^|/)(node_modules|dist|coverage|supabase_data|\.gitignore|docs|archive)' \
            | grep -vE '\.(lock|example|md|html|sql|css)$' \
            | xargs -r grep -lE 'JWT_SECRET\s*=\s*[A-Za-z0-9!@#$%^&*_+\-]{32,}' 2>/dev/null || true)

          if [ -n "$JWT_MATCHES" ]; then
            echo "::error::Possible real JWT_SECRET detected in:"
            echo "$JWT_MATCHES"
            FAILED=1
          fi

          if [ "$FAILED" = "1" ]; then
            echo "::error::Rotate the leaked secrets IMMEDIATELY (see docs/SECRET_ROTATION_RUNBOOK_2026-06-15.md)."
            exit 1
          fi

          echo "No hard-coded secrets found ✓"
          echo "::endgroup::"
