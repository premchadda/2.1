name: Data Guard

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  data-guard:
    name: Schema / Seed / Migration integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fail if supabase_data/ is committed
        run: |
          if [ -d "supabase_data" ]; then
            echo "\u274c supabase_data/ is in the working tree."
            echo "    This directory holds PII (full_name, avatar_url) and"
            echo "    stale demo seeds. It is gitignored; do not commit it."
            exit 1
          fi
          echo "\u2705 supabase_data/ is absent (gitignore working)."

      - name: Fail if any committed JSON contains PII keys
        run: |
          # The 2026-06-15 PII incident committed 528 test_attempts
          # records with these fields. Any JSON file in the repo
          # that contains them is treated as a data-handling bug.
          #
          # Two shapes are excluded because they *name* these keys without
          # holding personal data (both were false-positives that kept this
          # workflow red):
          #   * scripts/*schema_dictionary*.json — a column catalogue, e.g.
          #     {"name": "full_name"}.
          #   * apps/backend/src/data/collections/ — static exam catalogue copy,
          #     e.g. an exam's "full_name": "Staff Selection Commission ...".
          PII_KEYS='full_name|avatar_url|answer_map|time_map|password_hash|phone_number|aadhaar|pan_card'
          HITS=$(git ls-files '*.json' \
            | grep -vE '(^|/)scripts/[^/]*schema_dictionary[^/]*\.json$|^apps/backend/src/data/collections/' \
            | xargs -I{} grep -lE "\"($PII_KEYS)\"" {} 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "\u274c PII keys found in committed JSON files:"
            echo "$HITS"
            exit 1
          fi
          echo "\u2705 No PII keys found in committed JSON."

      - name: Fail on tracked secrets or secret values
        run: |
          # Never track .env files or the removed MiniMax key file.
          TRACKED_ENV=$(git ls-files | grep -E '(^|/)\.env$|(^|/)M3 Key\.txt$' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "\u274c Secret files tracked by git:"
            echo "$TRACKED_ENV"
            exit 1
          fi
          # High-confidence secret VALUE patterns in tracked code/config.
          # Docs and tests are excluded: they discuss key names and placeholders.
          HITS=$(git ls-files | grep -vE '^docs/|\.md$|__tests__|/test/|SECURITY_POSTURE|REMEDIATION_PLAN|AGENTS\.md' | xargs -I{} grep -lE 'rzp_live_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA )?PRIVATE KEY-----|sk-live-[A-Za-z0-9]+|sk-or-v1-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{16,}|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|xox[abp]-[A-Za-z0-9-]+|JWT_SECRET\s*=\s*[A-Za-z0-9!@#$%^&*_+\-]{32,}' {} 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "\u274c Secret values found in tracked files:"
            echo "$HITS"
            exit 1
          fi
          echo "\u2705 No tracked secrets or secret values."

      - name: Fail if two migrations share a numeric prefix
        run: |
          cd apps/backend/src/infrastructure/database/migrations
          # Migrations that were split use an NNN[a-z]_ suffix
          # (000_baseline_functions.sql + 000a_enable_rls_policies.sql,
          #  056a_* + 056b_*). Those two pairs are GRANDFATHERED — letter
          # suffixes are FORBIDDEN going forward (migrationRunner.js rejects
          # any new bare-number reuse outside 000/056, so a new 142a_+142b_
          # pair would pass this gate and then fail at boot). Use the next
          # free numeric prefix instead. The suffix letter below is only a
          # disambiguator for the grandfathered pairs and must NOT be treated
          # as a duplicate. What must never happen is an *ambiguous* number:
          #   1. the same full prefix twice (e.g. two 141_… files), or
          #   2. a number used by more than one file with no suffix letter.
          DUPES=$(ls | sed -n 's/^\([0-9]\+[a-z]\?\)_.*/\1/p' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "\u274c Duplicate numeric prefixes in migration filenames:"
            echo "$DUPES"
            for P in $DUPES; do ls | grep -E "^${P}_" || true; done
            exit 1
          fi

          AMBIGUOUS=$(for N in $(ls | sed -n 's/^\([0-9]\+\)[a-z]\?_.*/\1/p' | sort | uniq -d); do
            if [ "$(ls | grep -cE "^${N}_" || true)" -gt 1 ]; then echo "$N"; fi
          done)
          if [ -n "$AMBIGUOUS" ]; then
            echo "\u274c Ambiguous migration numbering — these numbers are reused without a suffix letter:"
            echo "$AMBIGUOUS"
            for N in $AMBIGUOUS; do ls | grep -E "^${N}_" || true; done
            exit 1
          fi
          echo "\u2705 Migration prefixes are unique (suffixed splits allowed)."

      - name: Fail on hardcoded demo INSERTs in migrations
        run: |
          # We allow INSERTs into the well-known RBAC reference tables
          # (permissions, roles) in migration 001, but nothing else.
          if grep -rE "^INSERT INTO (app_settings|navigation_menu|subjects|tests|questions|users|exams)" \
                apps/backend/src/infrastructure/database/migrations/ \
                --include="*.sql" 2>/dev/null; then
            echo ""
            echo "\u274c Hardcoded demo INSERTs found in migrations."
            echo "    Demo/seed data must live in apps/backend/src/infrastructure/database/seeders/,"
            echo "    not in SQL migrations. Migrations should only ALTER schema."
            exit 1
          fi
          echo "\u2705 No hardcoded demo INSERTs in migrations."

      - name: Fail if migration sequence has gaps
        run: |
          cd apps/backend/src/infrastructure/database/migrations
          # Skip leading 000s (init scripts) when checking for gaps.
          PREFIXES=$(ls | awk -F'_' '/^[0-9]/{print $1}' | sort -u)
          PREV=""
          for P in $PREFIXES; do
            if [ -z "$PREV" ]; then PREV=$P; continue; fi
            GAP=$((10#$P - 10#$PREV))
            if [ $GAP -gt 1 ] && [ "$PREV" != "000" ] && [ "$P" != "000" ]; then
              # Allow the historic 002 -> 018 jump (pre-refactor),
              # but flag any NEW gap.
              if [ "$PREV" != "002" ] || [ "$P" != "018" ]; then
                echo "\u26a0\ufe0f  Gap detected: ${PREV} -> ${P}"
                # Don't fail on historic gaps; surface them as warnings.
                echo "::warning::Migration gap ${PREV} -> ${P}. Consider backfilling."
              fi
            fi
            PREV=$P
          done
          echo "\u2705 Migration sequence check complete."

      - name: Run seeder fixtures through JSON parse
        run: |
          # NOTE: the previous form used `require('<repo-relative path>')`, which
          # Node resolves against node_modules (not the CWD) — it failed with
          # MODULE_NOT_FOUND for every fixture. Parse the files directly instead,
          # and pass the path as an argument to avoid interpolation hazards.
          shopt -s nullglob
          fixtures=(apps/backend/src/infrastructure/database/seeders/_fixtures/*.json)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "\u2705 No seeder fixtures to validate."
            exit 0
          fi
          for f in "${fixtures[@]}"; do
            node -e "const fs=require('fs');const p=process.argv[process.argv.length-1];const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d===null)throw new Error('null fixture');if(typeof d!=='object')throw new Error('not an object/array');console.log('\u2705 '+p)" "$f" || exit 1
          done
